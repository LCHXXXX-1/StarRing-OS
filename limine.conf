timeout: 3

/StarRing OS
    protocol: limine
    # resolution 是 entry 级（local）选项，放在顶层会被 Limine 忽略，
    # 结果使用显示器 EDID 原生分辨率：4K 屏会得到 3840x2160，内核
    # 虚拟屏上限 1920x1080，旧代码只在左上角画四分之一。
    # 1920x1080 是最坏情况上限；若该模式不存在，Limine 会退回 EDID
    # 原生模式（如 1366x768），所以小屏笔记本也不会被强行拉伸。
    # 临时排查（真机卡死）：强制 1024x768，排除高分辨率/显存带宽因素。
    resolution: 1024x768x32
    path: boot():/boot/StarRingOS.elf
    # 把 raw 图片作为内存 module 加载，内核直接从内存渲染（Live CD 无硬盘也可用）
    module_path: boot():/resource/logo.raw
    # 字体同样作为 module 载入：VMware 用自建空盘时盘上没有该文件，
    # 内核会在挂载后把它写进 SRFS；Live CD 则直接以这块内存为字体。
    module_path: boot():/usr/share/fonts/siyuan.sfn